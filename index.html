<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Escalera del Saber - Aventura Épica</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kalam:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(ellipse at 50% 0%, #102a5c 0%, #07142e 55%, #030916 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
      padding: 14px 10px 28px;
    }

    .app-shell {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .main-title {
      font-size: clamp(1.7rem, 4vw, 2.3rem);
      font-weight: 800;
      background: linear-gradient(90deg, #fde047, #38bdf8, #fde047);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      filter: drop-shadow(0 2px 12px rgba(56, 189, 248, 0.4));
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: clamp(0.82rem, 2vw, 0.94rem);
      color: #bae6fd;
      text-align: center;
      margin-bottom: 12px;
      font-weight: 500;
    }

    /* BARRA SUPERIOR */
    .top-bar {
      width: 100%;
      background: linear-gradient(180deg, rgba(15, 29, 58, 0.92), rgba(9, 18, 38, 0.95));
      border: 1px solid rgba(251, 191, 36, 0.35);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      position: relative;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 0.96rem;
      color: #f8fafc;
    }

    .score-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1rem;
      color: #fbbf24;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .score-badge.bump {
      transform: scale(1.28);
      color: #fef08a;
      text-shadow: 0 0 18px rgba(250, 204, 21, 0.95);
    }

    .floating-points {
      position: absolute;
      right: 16px;
      top: -12px;
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: #ffffff;
      font-weight: 800;
      font-size: 0.9rem;
      padding: 5px 13px;
      border-radius: 999px;
      border: 1.5px solid #bbf7d0;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.85);
      pointer-events: none;
      opacity: 0;
      z-index: 60;
    }

    .floating-points.show {
      animation: floatUpPts 1.25s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes floatUpPts {
      0% { opacity: 0; transform: translateY(16px) scale(0.7); }
      25% { opacity: 1; transform: translateY(-6px) scale(1.12); }
      75% { opacity: 1; transform: translateY(-22px) scale(1); }
      100% { opacity: 0; transform: translateY(-38px) scale(0.9); }
    }

    /* ESCENARIO FANTASÍA 3D */
    .stage-wrapper {
      position: relative;
      width: 100%;
      height: 650px;
      border-radius: 20px;
      overflow: hidden;
      border: 1.5px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
      margin-bottom: 12px;
    }

    #fantasy-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* TARJETA DE PREGUNTA ESTILO MÁGICO DORADO/AZUL */
    .holo-quiz-card {
      position: absolute;
      right: 12px;
      bottom: 14px;
      width: 55%;
      min-width: 300px;
      max-width: 380px;
      background: linear-gradient(165deg, rgba(12, 25, 52, 0.86) 0%, rgba(7, 15, 34, 0.94) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 16px;
      padding: 16px 15px;
      border: 1.5px solid rgba(251, 191, 36, 0.65);
      box-shadow:
        0 12px 32px rgba(0, 0, 0, 0.65),
        0 0 22px rgba(251, 191, 36, 0.25),
        inset 0 0 15px rgba(56, 189, 248, 0.15);
      z-index: 10;
      transition: all 0.3s ease;
    }

    .holo-quiz-card.card-correct {
      border-color: #4ade80;
      box-shadow: 0 0 35px rgba(34, 197, 94, 0.6), inset 0 0 20px rgba(34, 197, 94, 0.22);
    }

    .holo-quiz-card.card-wrong {
      border-color: #f87171;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.5);
      animation: shakeCard 0.42s ease;
    }

    @keyframes shakeCard {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-7px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    .level-pill {
      display: inline-block;
      background: linear-gradient(90deg, #d97706, #f59e0b);
      color: #fffbeb;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      padding: 4px 11px;
      border-radius: 999px;
      text-transform: uppercase;
      margin-bottom: 8px;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
    }

    .question-title {
      font-size: 0.93rem;
      font-weight: 700;
      line-height: 1.36;
      color: #ffffff;
      margin-bottom: 11px;
    }

    .question-title .req {
      color: #fbbf24;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .option-item {
      width: 100%;
      background: rgba(19, 34, 64, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 10px;
      padding: 9px 11px;
      color: #f1f5f9;
      font-size: 0.8rem;
      font-weight: 500;
      line-height: 1.3;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-item:hover:not(:disabled) {
      border-color: #fde047;
      background: rgba(30, 54, 96, 0.9);
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.25);
    }

    .option-item.selected {
      border-color: #38bdf8;
      background: rgba(14, 116, 144, 0.45);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
      color: #ffffff;
    }

    .option-item.correct-anim {
      border-color: #4ade80 !important;
      background: linear-gradient(90deg, rgba(22, 163, 74, 0.65), rgba(21, 128, 61, 0.45)) !important;
      box-shadow: 0 0 22px rgba(34, 197, 94, 0.7) !important;
      color: #ffffff !important;
      transform: scale(1.02);
    }

    .option-item.wrong-anim {
      border-color: #f87171 !important;
      background: linear-gradient(90deg, rgba(220, 38, 38, 0.55), rgba(153, 27, 27, 0.4)) !important;
      color: #fecaca !important;
    }

    .radio-circle {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 1.5px solid #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .option-item.selected .radio-circle {
      border-color: #38bdf8;
      box-shadow: 0 0 6px #38bdf8;
    }

    .radio-inner {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #38bdf8;
      transform: scale(0);
      transition: transform 0.2s ease;
    }

    .option-item.selected .radio-inner {
      transform: scale(1);
    }

    .feedback-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 8px 11px;
      border-radius: 9px;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .feedback-banner.ok {
      display: flex;
      background: rgba(22, 163, 74, 0.35);
      border: 1px solid #4ade80;
      color: #bbf7d0;
    }

    .feedback-banner.fail {
      display: flex;
      background: rgba(220, 38, 38, 0.32);
      border: 1px solid #f87171;
      color: #fecaca;
    }

    .next-step-btn {
      width: 100%;
      background: linear-gradient(90deg, #0284c7 0%, #2563eb 50%, #1d4ed8 100%);
      border: 1px solid #7dd3fc;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.86rem;
      padding: 11px 15px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.55);
      transition: all 0.2s ease;
    }

    .next-step-btn:hover:not(:disabled) {
